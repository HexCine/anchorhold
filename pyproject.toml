[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "anchorhold"
version = "0.1.1"
description = "Detect removed and silently retargeted documentation permalinks across HTML builds."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "anchorhold contributors"}]
dependencies = ["html5lib>=1.1,<2"]
classifiers = ["Development Status :: 3 - Alpha", "Environment :: Console", "Operating System :: OS Independent", "Programming Language :: Python :: 3"]

[project.urls]
Repository = "https://github.com/HexCine/anchorhold"
Issues = "https://github.com/HexCine/anchorhold/issues"
Documentation = "https://github.com/HexCine/anchorhold/blob/main/README.md"

[project.scripts]
anchorhold = "anchorhold.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/anchorhold"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/docs", "/README.md", "/LICENSE", "/CONTRIBUTING.md", "/SECURITY.md", "/CHANGELOG.md", "/pyproject.toml", "/.github", "/.gitignore"]
